name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [alpha, rc2]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit-publication.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.runtime == 'rc2'
        run: npm install --ignore-scripts --no-audit --no-fund @deepseek-ai/cordis@4.0.4 @deepseek-ai/schemastery@3.18.4 @deepseek-ai/dsh-session@0.2.0-rc.2 @deepseek-ai/dsh-tools@0.2.0-rc.2 @deepseek-ai/dsh-skill@0.2.0-rc.2 @deepseek-ai/dsh-llm@0.2.0-rc.2 @deepseek-ai/dsh-system-prompt@0.2.0-rc.2
      - run: npm run check
      - run: docker build -t evoforge-sandbox:1 sandbox
      - run: npm test
        env:
          EVOFORGE_DOCKER_TESTS: '1'
      - run: npm run benchmark
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: evoforge-artifacts-${{ matrix.runtime }}
          path: artifacts/
